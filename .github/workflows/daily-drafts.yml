# 매일 아침 오늘 편성표대로 게시물 초안(이미지/영상/캡션)을 만들어 Artifacts 로 올린다.
# 금요일 0시 10분에는 에픽 무료 게임만 따로 만든다 (에픽은 금요일 0시 KST 교체).
# 계정명/브랜드는 저장소 Settings → Variables 의 DEALBOT_HANDLE, DEALBOT_BRAND 로 정한다.
name: daily-drafts

permissions:
  contents: write

on:
  schedule:
    - cron: "37 23 * * *"   # 매일 08:37 KST
    - cron: "10 15 * * 4"   # 금요일 00:10 KST
  workflow_dispatch:
    inputs:
      kinds:
        description: "만들 포맷 (비우면 오늘 편성표). 예: weekly lowest reel"
        required: false

concurrency:
  group: dealbot-data
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
      DEALBOT_HANDLE: ${{ vars.DEALBOT_HANDLE }}
      DEALBOT_BRAND: ${{ vars.DEALBOT_BRAND }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: Render drafts
        run: |
          if [ -n "${{ github.event.inputs.kinds }}" ]; then
            python -m dealbot post ${{ github.event.inputs.kinds }} --motion
          elif [ "${{ github.event.schedule }}" = "10 15 * * 4" ]; then
            python -m dealbot post free --motion
          else
            python -m dealbot today --motion
          fi
      - name: Copy results to GameSaleInsta/<날짜>
        # 평가용으로 완성본(이미지, 영상, 캡션)만 저장소에 남긴다. 중간 파일(trailer_*, part_*)과 html/json 은 뺀다.
        run: |
          d=$(TZ=Asia/Seoul date +%F)
          [ -d "output/$d" ] || exit 0
          mkdir -p "GameSaleInsta/$d"
          (cd "output/$d" && find . -type f \( -name '*.png' -o -name '*.mp4' -o -name '*.gif' -o -name 'caption.txt' \) \
             ! -name 'trailer_*' ! -name 'part_*' -exec cp --parents {} "../../GameSaleInsta/$d/" \;)
      - name: Commit weekly state (shown games, savings ledger)
        # 요일별 게시물이 같은 게임을 반복하지 않도록 이번 주 소개 기록과 누적 장부를 저장소에 남긴다.
        # 가격 DB(sqlite)는 collect-prices 워크플로가 커밋하므로 여기서는 되돌린다 (바이너리 충돌 방지).
        run: |
          git checkout -- data/price_history.sqlite 2>/dev/null || true
          git config user.name "dealbot"
          git config user.email "dealbot@users.noreply.github.com"
          for f in data/week_state.json data/ledger.json GameSaleInsta; do [ -e "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "data: weekly state and drafts $(TZ=Asia/Seoul date +%F)"
          git pull --rebase --autostash || true
          git push || true
      - uses: actions/upload-artifact@v4
        with:
          name: drafts-${{ github.run_id }}
          path: output/
          retention-days: 7
